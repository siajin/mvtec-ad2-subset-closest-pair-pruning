[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvtec-ad2-subset-closest-pair-pruning"
version = "0.1.0"
description = "Subset-based Closest-Pair Pruning for normal representative selection on MVTec AD 2"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "torch==2.10.0"]

[project.optional-dependencies]
evaluation = ["scipy==1.15.3", "opencv-python==4.12.0.88"]

[project.urls]
Repository = "https://github.com/siajin/mvtec-ad2-subset-closest-pair-pruning"

[tool.setuptools.packages.find]
include = ["scpp*", "research*"]
